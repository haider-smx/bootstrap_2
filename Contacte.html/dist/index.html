<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom styles -->
    <link rel="stylesheet" href="../../css/custom.css">
    <style>
      body {
        background: linear-gradient(135deg, #001f4b, #001f4b); 
        color: #fff; 
        font-family: 'Poppins', sans-serif; 
        background-image: -moz-linear-gradient(); 
      }

      footer {
        background-color: #021228;
        text-align: center;
        color: #fff;
        padding: 15px;
        font-size: 14px;
        margin-top: auto;
      }
      
      main {
       padding: 40px;
       display: flex;
       justify-content: center;
       flex-wrap: wrap;
       gap: 30px;
     }

      .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        width: 350px;
        transition: transform 0.3s, box-shadow 0.3s;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        text-align: center;
      }

      .card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      }

      .card img {
        width: 100%;
        display: block;
        border-bottom: 3px solid rgba(255,255,255,0.2);
        transition: transform 0.3s;
      }

      .card img:hover {
        transform: scale(1.1);
      }

      .card-body {
        padding: 30px 20px;
        color: #fff;
      }

      /* Título Contacto azul luz */
      .card-body h2 {
        font-size: 32px;
        color: #00f0ff;
        text-shadow: 0 0 10px #00f0ff, 0 0 20px #00d0ff, 0 0 30px #00aaff;
        margin-bottom: 10px;
      }

      .card-body p {
        font-size: 14px;
        margin-bottom: 20px;
        color: #e0e0e0;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      input, textarea {
        padding: 12px;
        border-radius: 12px;
        border: none;
        outline: none;
        font-size: 14px;
        resize: none;
        background: rgba(255,255,255,0.2);
        color: #fff;
        transition: transform 0.2s;
      }

      input::placeholder, textarea::placeholder {
        color: rgba(255,255,255,0.7);
      }

      input:focus, textarea:focus {
        background: rgba(255,255,255,0.35);
        transform: scale(1.02);
      }

      button {
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(45deg, #00f0ff, #0099ff);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      }

      button:hover {
        background: linear-gradient(45deg, #0099ff, #00f0ff);
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      }

      label {
        font-size: 14px;
        text-align: left;
        display: flex;
        flex-direction: column;
      }

      @media (max-width: 768px) {
        .card {
          width: 90%;
        }
      }

    </style>
  </head>
  <body>
    <div class="container-flex bg-strong min-vh-100 d-flex flex-column">
      <!-- Navbar (same style as index.html) -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-strong sticky-top shadow-sm">
        <div class="container-fluid">
          <a class="navbar-brand" href="../../index.html">
            <img src="" alt="" style="width:40px;" class="rounded-pill">
            <span class="d-inline align-middle text-white mb-0">H4ID3R</span>
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item"><a class="nav-link" href="../../index.html">Inici</a></li>
              <li class="nav-item"><a class="nav-link" href="../../projecte.html/projecte.html">Projectes</a></li>
              <li class="nav-item"><a class="nav-link active" href="index.html">Contacte</a></li>
            </ul>
          </div>
        </div>
      </nav>  

      <main>
        <div class="card">
          <div class="card-body">
            <h2>Contacto</h2>
            <p>Déjanos tu mensaje y te responderemos rápidamente.</p>
            <form id="contactForm" action="https://formspree.io/f/mgvpjpqe" method="POST">
              <label>
                Tu email:
                <input type="email" name="email" placeholder="ejemplo@correo.com" required>
              </label>
              <label>
                Tu mensaje:
                <textarea name="message" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
              </label>
              <button type="submit">Enviar</button>
            </form>
          </div>
        </div>
      </main>
    
      <!-- Footer (match index and contacte) -->
      <footer>
        © 2025/2026 Institut Barres i Ones
      </footer>
    </div>
    
    <script>
      // Limpiar formulario al enviar
      const form = document.getElementById('contactForm');
      form.addEventListener('submit', function(e) {
        setTimeout(() => {
          form.reset(); // limpia los campos
        }, 100); // pequeño delay para permitir envío
      });

      // Limpiar campos al recargar la página
      window.addEventListener('load', function() {
        form.reset();
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
